<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドイツ語 基礎暗記ドリル</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f7f3ea">
<style>
  :root{
    --bg:#fafaf7; --bg2:#ffffff; --bg3:#eeeee8; --line:#d8d8d0;
    --fg:#1d2126; --fg2:#4b5561; --fg3:#7a8592;
    --ac:#a8820f; --acbg:#f4e9c4; --acfg:#6b5208;
    --ok:#1f8a58; --ng:#c8443b; --onac:#ffffff; --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#121519; --bg2:#1a1e24; --bg3:#232931; --line:#333b45;
      --fg:#e8ecf2; --fg2:#9aa5b4; --fg3:#6b7683;
      --ac:#c9a227; --acbg:rgba(201,162,39,.18); --acfg:#e8c766;
      --ok:#5fbf8a; --ng:#e0685f; --onac:#1a1509; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121519; --bg2:#1a1e24; --bg3:#232931; --line:#333b45;
    --fg:#e8ecf2; --fg2:#9aa5b4; --fg3:#6b7683;
    --ac:#c9a227; --acbg:rgba(201,162,39,.18); --acfg:#e8c766;
    --ok:#5fbf8a; --ng:#e0685f; --onac:#1a1509; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);
    font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
    font-size:15px;line-height:1.65;
    padding:14px 16px calc(60px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:19px;margin:4px 0 2px;color:var(--ac)}
  .sub{color:var(--fg3);font-size:12px;margin:0 0 14px}
  h2{font-size:14px;margin:0 0 8px;color:var(--ac);letter-spacing:.04em}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .hidden{display:none !important}
  button{font-family:inherit;font-size:15px;cursor:pointer;color:var(--fg)}
  .btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:11px 16px;min-height:44px}
  .btn.primary{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:600}
  .btn.ok{border-color:var(--ok);color:var(--ok)}
  .btn.ng{border-color:var(--ng);color:var(--ng)}
  .btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
  .btn.block{width:100%}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .lbl{font-size:12px;color:var(--fg3);min-width:52px}
  .chip{background:var(--bg3);border:1px solid var(--line);color:var(--fg2);border-radius:999px;padding:7px 14px;font-size:13px;min-height:36px}
  .chip.on{background:var(--acbg);border-color:var(--ac);color:var(--acfg)}
  .deck{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
  .deck b{display:block;font-size:15px}
  .deck span{display:block;font-size:12px;color:var(--fg3)}
  .deck em{font-style:normal;font-size:12px;color:var(--ng)}
  .back{background:none;border:none;color:var(--fg3);padding:6px 0;font-size:13px;margin-bottom:6px}
  table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 10px}
  th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
  th{background:var(--bg3);font-weight:600;font-size:12px;color:var(--fg2)}
  td.de,.de{font-family:var(--mono);font-size:14px}
  .ref p,.ref li{margin:4px 0;font-size:14px}
  .ref ul{padding-left:20px;margin:6px 0}
  .ref h3{font-size:13px;margin:12px 0 4px;color:var(--fg2)}
  .prog{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:10px}
  .prog>i{display:block;height:100%;background:var(--ac);width:0}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--fg3);margin-bottom:6px}
  .plabel{font-size:12px;color:var(--fg3);margin-bottom:2px}
  .prompt{font-size:26px;font-weight:600;line-height:1.35;margin:4px 0 14px;word-break:break-word}
  .prompt.de{font-family:inherit}
  input.ans{
    width:100%;font-size:18px;padding:12px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--fg);font-family:var(--mono);
  }
  input.ans:focus{outline:2px solid var(--ac);outline-offset:0}
  .keys{display:flex;gap:6px;margin:8px 0 10px}
  .keys button{flex:1;min-height:40px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;font-size:17px;font-family:var(--mono)}
  .fb{border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
  .fb.ok{background:rgba(31,138,88,.12);border:1px solid var(--ok)}
  .fb.ng{background:rgba(200,68,59,.10);border:1px solid var(--ng)}
  .fb .ans-show{font-family:var(--mono);font-size:18px;font-weight:600;word-break:break-word}
  .fb .mine{font-size:13px;color:var(--fg2);margin-top:2px}
  .big{font-size:34px;font-weight:700;color:var(--ac)}
  .wr{font-size:13px;border-bottom:1px solid var(--line);padding:6px 0}
  .wr:last-child{border:none}
  .wr .d{font-family:var(--mono);color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">

<section id="home">
  <h1>ドイツ語 基礎暗記ドリル</h1>
  <p class="sub">数字・冠詞・時刻・挨拶など、暗記が必要な基礎をテーマ別に復習します。<br>
  <span class="de">a:</span>→ä、<span class="de">o:</span>→ö、<span class="de">u:</span>→ü と打てます(下のボタンでも入力可)。</p>
  <div id="decklist"></div>
</section>

<section id="deck" class="hidden">
  <button class="back" id="deckBack">&larr; テーマ一覧</button>
  <h1 id="deckTitle"></h1>
  <p class="sub" id="deckSub"></p>
  <div class="card">
    <h2>練習の設定</h2>
    <div class="row" id="rowCount"><span class="lbl">出題数</span></div>
    <div class="row hidden" id="rowDir"><span class="lbl">向き</span></div>
    <div class="row"><span class="lbl">音声</span><button class="chip" id="autoSpeak">自動読み上げ:切</button></div>
    <div class="row">
      <button class="btn primary" id="startBtn">はじめる</button>
      <button class="btn hidden" id="retryStored">前回まちがえた問題だけ</button>
    </div>
  </div>
  <div class="card ref"><h2>要点・一覧</h2><div id="refBody"></div></div>
</section>

<section id="quiz" class="hidden">
  <button class="back" id="quitBtn">&larr; やめる</button>
  <div class="meta"><span id="qNo"></span><span id="qScore"></span></div>
  <div class="prog"><i id="qProg"></i></div>
  <div class="card">
    <div class="plabel" id="qLabel"></div>
    <div class="prompt" id="qPrompt"></div>
    <div id="typeArea">
      <input class="ans" id="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <div class="keys">
        <button data-k="ä">ä</button><button data-k="ö">ö</button><button data-k="ü">ü</button><button data-k="ß">ß</button>
      </div>
      <button class="btn primary block" id="checkBtn">答え合わせ</button>
    </div>
    <div id="flipArea" class="hidden">
      <button class="btn primary block" id="showBtn">答えを見る</button>
    </div>
    <div id="fb" class="fb hidden"></div>
    <div id="selfArea" class="row hidden">
      <button class="btn ok" id="selfOk" style="flex:1">わかった (1)</button>
      <button class="btn ng" id="selfNg" style="flex:1">まちがい (2)</button>
    </div>
    <div class="row">
      <button class="btn sm hidden" id="speakBtn">読み上げ</button>
      <button class="btn primary hidden" id="nextBtn" style="flex:1">つぎへ (Enter)</button>
    </div>
  </div>
</section>

<section id="result" class="hidden">
  <h1>結果</h1>
  <div class="card">
    <div class="big" id="rScore"></div>
    <div class="sub" id="rSub"></div>
    <div class="row">
      <button class="btn primary" id="rWrong">まちがえた問題だけもう一度</button>
      <button class="btn" id="rAgain">同じ設定でもう一度</button>
      <button class="btn" id="rHome">テーマ一覧へ</button>
    </div>
  </div>
  <div class="card"><h2>まちがえた問題</h2><div id="rList"></div></div>
</section>

</div>

<script>
'use strict';
/* ================= 共通 ================= */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tbl=(h,rows)=>'<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i>0?' class="de"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</table>';

/* ================= 数詞 ================= */
const ONES=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
function numAll(n){
  if(n<20) return [ONES[n]];
  if(n<100){const u=n%10,t=Math.floor(n/10);return [u? (u===1?'ein':ONES[u])+'und'+TENS[t] : TENS[t]];}
  if(n<1000){
    const h=Math.floor(n/100),r=n%100,pre=h===1?['einhundert','hundert']:[ONES[h]+'hundert'];
    const rest=r?numAll(r):[''];
    return pre.flatMap(p=>rest.map(x=>p+x));
  }
  const t=Math.floor(n/1000),r=n%1000,pre=t===1?['eintausend','tausend']:numAll(t).map(x=>x+'tausend');
  const rest=r?numAll(r):[''];
  return pre.flatMap(p=>rest.map(x=>p+x));
}
const num=n=>numAll(n)[0];
function yearAll(y){
  if(y>=1100&&y<2000){const h=Math.floor(y/100),r=y%100;return [num(h)+'hundert'+(r?num(r):''),...numAll(y)];}
  return numAll(y);
}
function ordAll(n){
  const sp={1:'erste',3:'dritte',7:'siebte',8:'achte'};
  if(sp[n]) return [sp[n]];
  if(n<20) return [ONES[n]+'te'];
  return numAll(n).map(x=>x+'ste');
}
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONTHS_JA=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

/* ================= 時刻 ================= */
const hUhr=h=>h===1?'ein':num(h);
const hNach=h=>h===1?'eins':num(h);
function timeOfficial(){
  const h=rnd(0,23),m=Math.random()<.35?0:rnd(1,59);
  const ans=hUhr(h)+' Uhr'+(m?' '+num(m):'');
  return {p:pad(h)+':'+pad(m),pl:'公式(24時間制)で言う',a:[ans],show:ans,type:'de',dir:'w',es:1};
}
const pad=n=>String(n).padStart(2,'0');
function timeInformal(){
  const h=rnd(1,12),m=5*rnd(0,11),h2=h%12+1;
  let a=[],show;
  const N=hNach(h),N2=hNach(h2);
  const off=hUhr(h)+' Uhr'+(m?' '+num(m):'');
  switch(m){
    case 0:  a=[hUhr(h)+' Uhr'];break;
    case 5:  a=['fünf nach '+N];break;
    case 10: a=['zehn nach '+N];break;
    case 15: a=['Viertel nach '+N];break;
    case 20: a=['zwanzig nach '+N,'zehn vor halb '+N2];break;
    case 25: a=['fünf vor halb '+N2];break;
    case 30: a=['halb '+N2];break;
    case 35: a=['fünf nach halb '+N2];break;
    case 40: a=['zwanzig vor '+N2,'zehn nach halb '+N2];break;
    case 45: a=['Viertel vor '+N2];break;
    case 50: a=['zehn vor '+N2];break;
    case 55: a=['fünf vor '+N2];break;
  }
  if(m) a.push(off);
  show=a[0]+(a.length>1?'  (他: '+a.slice(1).join(' / ')+')':'');
  return {p:h+':'+pad(m),pl:'日常(12時間制)で言う',a,show,type:'de',dir:'w',es:1};
}

const DAYPARTS=[['朝','der Morgen',['Morgen']],['午前','der Vormittag',['Vormittag']],['昼(正午)','der Mittag',['Mittag']],['午後','der Nachmittag',['Nachmittag']],['夕方・晩','der Abend',['Abend']],['夜','die Nacht',['Nacht']]];

/* 並びは 1格・4格・3格・2格 の順 */

];

/* ================= カード生成ヘルパ ================= */
function pairCards(pairs){
  const out=[];
  for(const [ja,de,alt] of pairs){
    out.push({p:ja,pl:'日本語 → ドイツ語',a:[de,...(alt||[])],show:de,type:'de',dir:'w'});
    out.push({p:de,pl:'ドイツ語 → 意味',show:ja,type:'ja',dir:'r'});
  }
  return out;
}
function pairRef(pairs,h1,h2){return tbl([h1,h2],pairs.map(x=>[esc(x[0]),esc(x[1])]));}
const artCards=()=>{
  const out=[];
  for(const [name,g] of Object.entries(ART)){
    [['m','男性'],['f','女性'],['n','中性'],['p','複数']].forEach(([k,jn])=>{
      if(!g[k]) return;
      [[0,'1格'],[1,'4格'],[2,'3格'],[3,'2格']].forEach(([i,cn])=>{
        out.push({p:name+'\n'+jn+' ・ '+cn,pl:'語尾つきの形を書く',a:[g[k][i]],show:g[k][i],type:'de',dir:'w'});
      });
    });
  }
  return out;
};

/* ================= 状態 ================= */
const STORE_KEY='de-kiso-drill-v1';
let store={};
try{store=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{};}catch(e){store={};}
const saveStore=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}};
const opt={count:20,dir:'both',speak:false};
let cur=null; // 現在のテーマ
let S=null;   // セッション
let lastCards=null;

const show=id=>{['home','deck','quiz','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));window.scrollTo(0,0);};

/* ================= ホーム ================= */
function renderHome(){
  $('#decklist').innerHTML='';
  DECKS.forEach(d=>{
    const b=document.createElement('button');b.className='deck';
    const w=(store[d.id]&&store[d.id].wrong)||[];
    b.innerHTML='<b>'+esc(d.title)+'</b><span>'+esc(d.sub)+'</span>'+(w.length?'<em>前回のまちがい '+w.length+' 問</em>':'');
    b.onclick=()=>openDeck(d);
    $('#decklist').appendChild(b);
  });
  show('home');
}

/* ================= テーマ画面 ================= */
function chips(rowId,items,key,fmt){
  const row=$(rowId);
  row.querySelectorAll('.chip').forEach(x=>x.remove());
  items.forEach(v=>{
    const c=document.createElement('button');c.className='chip'+(opt[key]===v?' on':'');c.textContent=fmt?fmt(v):v;
    c.onclick=()=>{opt[key]=v;chips(rowId,items,key,fmt);};
    row.appendChild(c);
  });
}
function openDeck(d){
  cur=d;
  $('#deckTitle').textContent=d.title;$('#deckSub').textContent=d.sub;
  const all=d.gen();
  chips('#rowCount',[10,20,50,0],'count',v=>v?v+' 問':'全部');
  const dirs=new Set(all.map(c=>c.dir));
  const hasDirs=dirs.has('w')&&(dirs.has('r'));
  $('#rowDir').classList.toggle('hidden',!hasDirs);
  if(!hasDirs) opt.dir='both';
  else chips('#rowDir',['w','r','both'],'dir',v=>({w:'書く(独語を入力)',r:'読む(意味を答える)',both:'両方'})[v]);
  $('#autoSpeak').textContent='自動読み上げ:'+(opt.speak?'入':'切');
  const w=(store[d.id]&&store[d.id].wrong)||[];
  $('#retryStored').classList.toggle('hidden',!w.length);
  $('#retryStored').textContent='前回まちがえた問題だけ('+w.length+' 問)';
  $('#refBody').innerHTML=d.ref();
  show('deck');
}
$('#deckBack').onclick=renderHome;
$('#autoSpeak').onclick=()=>{opt.speak=!opt.speak;$('#autoSpeak').textContent='自動読み上げ:'+(opt.speak?'入':'切');};
$('#startBtn').onclick=()=>{
  let cards=cur.gen();
  if(opt.dir!=='both') cards=cards.filter(c=>opt.dir==='w'?c.dir!=='r':c.dir==='r');
  cards=shuffle(cards);
  if(opt.count) cards=cards.slice(0,opt.count);
  startSession(cards);
};
$('#retryStored').onclick=()=>startSession(shuffle(store[cur.id].wrong));

/* ================= 出題 ================= */
function startSession(cards){
  if(!cards.length) return;
  lastCards=cards;
  S={cards,i:0,ok:0,wrong:[],phase:'ask'};
  show('quiz');ask();
}
const conv=s=>s.replace(/([aouAOU]):/g,(m,c)=>({a:'ä',o:'ö',u:'ü',A:'Ä',O:'Ö',U:'Ü'})[c]);
function speak(t){
  try{
    if(!window.speechSynthesis) return;
    const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.9;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
const speakText=c=>(c.dir==='r'||c.dir==='r2')?c.p:(c.type==='ja'?null:c.show.split('  (')[0].split(' / ')[0]);
function ask(){
  const c=S.cards[S.i];S.phase='ask';
  $('#qNo').textContent=(S.i+1)+' / '+S.cards.length;
  $('#qScore').textContent='正解 '+S.ok;
  $('#qProg').style.width=(S.i/S.cards.length*100)+'%';
  $('#qLabel').textContent=c.pl;
  const pr=$('#qPrompt');pr.textContent=c.p;pr.style.whiteSpace='pre-line';
  pr.classList.toggle('de',c.dir==='r'||c.dir==='r2');
  $('#fb').classList.add('hidden');$('#selfArea').classList.add('hidden');$('#nextBtn').classList.add('hidden');
  const typed=c.type!=='ja';
  $('#typeArea').classList.toggle('hidden',!typed);
  $('#flipArea').classList.toggle('hidden',typed);
  const hearBefore=(c.dir==='r'||c.dir==='r2');
  $('#speakBtn').classList.toggle('hidden',!hearBefore);
  if(hearBefore&&opt.speak) speak(c.p);
  $('#checkBtn').classList.remove('hidden');$('#typeArea').querySelector('.keys').classList.remove('hidden');
  const inp=$('#ans');inp.value='';inp.disabled=false;
  if(typed) setTimeout(()=>inp.focus(),30);
}
function normS(s,c){
  s=conv(s).normalize('NFC').trim().toLowerCase().replace(/[’`´]/g,"'");
  if(c.es) s=s.replace(/^es ist /,'');
  s=s.replace(/[.,!?;]+$/,'').replace(/\s+/g,' ').trim();
  if(c.type==='ns') s=s.replace(/[\s-]/g,'');
  if(c.type==='num') s=s.replace(/[\s.,]/g,'');
  return s;
}
function judge(c,raw){
  const u=normS(raw,c);
  const alts=c.a.map(x=>normS(x,c));
  if(alts.includes(u)) return {ok:true};
  const ss=x=>x.replace(/ß/g,'ss');
  if(alts.map(ss).includes(ss(u))) return {ok:true,note:'ß の綴りに注意: '+c.show};
  return {ok:false};
}
function finish(ok,c,mine){
  S.phase='fb';
  if(ok) S.ok++; else S.wrong.push(c);
  $('#qScore').textContent='正解 '+S.ok;
  $('#nextBtn').classList.remove('hidden');
  $('#nextBtn').textContent=S.i+1>=S.cards.length?'結果を見る (Enter)':'つぎへ (Enter)';
  const st=speakText(c);
  $('#speakBtn').classList.toggle('hidden',!st);
  if(st&&opt.speak) speak(st);
}
$('#checkBtn').onclick=()=>{
  if(S.phase!=='ask') return;
  const c=S.cards[S.i],raw=$('#ans').value;
  if(!raw.trim()){ $('#ans').focus(); return; }
  const r=judge(c,raw);
  const fb=$('#fb');fb.className='fb '+(r.ok?'ok':'ng');fb.classList.remove('hidden');
  fb.innerHTML=(r.ok?'<b>正解</b>':'<b>不正解</b>')+'<div class="ans-show">'+esc(c.show)+'</div>'+
    (r.note?'<div class="mine">'+esc(r.note)+'</div>':'')+(!r.ok?'<div class="mine">あなたの答え: '+esc(conv(raw))+'</div>':'');
  $('#ans').disabled=true;
  $('#typeArea').querySelector('.keys').classList.add('hidden');
  $('#checkBtn').classList.add('hidden');
  finish(r.ok,c,raw);
};
$('#showBtn').onclick=()=>{
  if(S.phase!=='ask') return;
  const c=S.cards[S.i];
  const fb=$('#fb');fb.className='fb';fb.classList.remove('hidden');
  fb.innerHTML='<div class="ans-show">'+esc(c.show)+'</div>';
  $('#flipArea').classList.add('hidden');$('#selfArea').classList.remove('hidden');
  S.phase='self';
  if(opt.speak&&(c.dir==='r'||c.dir==='r2')) speak(c.p);
};
const selfMark=ok=>{
  if(S.phase!=='self') return;
  $('#selfArea').classList.add('hidden');
  finish(ok,S.cards[S.i],'');
};
$('#selfOk').onclick=()=>selfMark(true);
$('#selfNg').onclick=()=>selfMark(false);
$('#nextBtn').onclick=next;
$('#speakBtn').onclick=()=>{const c=S.cards[S.i];const t=(c.dir==='r'||c.dir==='r2')?c.p:speakText(c);if(t)speak(t);};
function next(){
  if(!S||S.phase!=='fb') return;
  $('#checkBtn').classList.remove('hidden');
  $('#typeArea').querySelector('.keys').classList.remove('hidden');
  S.i++;
  if(S.i>=S.cards.length) return showResult();
  ask();
}
$('#quitBtn').onclick=()=>openDeck(cur);
$('#ans').addEventListener('input',e=>{
  const el=e.target,p=el.selectionStart,before=el.value;
  const after=conv(before);
  if(after!==before){el.value=after;const d=before.length-after.length;el.setSelectionRange(p-d,p-d);}
});
document.querySelectorAll('.keys button').forEach(b=>{
  b.addEventListener('pointerdown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    const el=$('#ans');if(el.disabled) return;
    const s=el.selectionStart,e2=el.selectionEnd;
    el.value=el.value.slice(0,s)+b.dataset.k+el.value.slice(e2);
    el.setSelectionRange(s+1,s+1);el.focus();
  });
});
document.addEventListener('keydown',e=>{
  if($('#quiz').classList.contains('hidden')||!S) return;
  if(e.key==='Enter'){
    e.preventDefault();
    if(S.phase==='ask'){ if(!$('#typeArea').classList.contains('hidden')) $('#checkBtn').click(); else $('#showBtn').click(); }
    else if(S.phase==='fb') next();
  }else if(S.phase==='self'){
    if(e.key==='1') selfMark(true); else if(e.key==='2') selfMark(false);
  }
});

/* ================= 結果 ================= */
function showResult(){
  const n=S.cards.length;
  store[cur.id]={wrong:S.wrong,last:{ok:S.ok,n,t:Date.now()}};saveStore();
  $('#rScore').textContent=S.ok+' / '+n+'('+Math.round(S.ok/n*100)+'%)';
  $('#rSub').textContent=S.wrong.length?'まちがえた問題は次回「前回まちがえた問題だけ」で復習できます。':'全問正解です。';
  $('#rWrong').classList.toggle('hidden',!S.wrong.length);
  $('#rList').innerHTML=S.wrong.length?S.wrong.map(c=>'<div class="wr">'+esc(c.p.replace(/\n/g,' '))+'<br><span class="d">'+esc(c.show)+'</span></div>').join(''):'<div class="wr">なし</div>';
  show('result');
}
$('#rWrong').onclick=()=>startSession(shuffle(S.wrong));
$('#rAgain').onclick=()=>{
  let cards=cur.gen();
  if(opt.dir!=='both') cards=cards.filter(c=>opt.dir==='w'?c.dir!=='r':c.dir==='r');
  cards=shuffle(cards);if(opt.count)cards=cards.slice(0,opt.count);
  startSession(cards);
};
$('#rHome').onclick=renderHome;

renderHome();
</script>
