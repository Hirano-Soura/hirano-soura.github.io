<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学習ポータル">
<title>学習ポータル</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1f2430;--sub:#6b7280;--line:#e5e7eb;--ok:#16a34a;--okbg:#f0fdf4;--warn:#b45309;--warnbg:#fffbeb;--muted:#9ca3af}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px}
  .hrow{max-width:820px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:19px}
  .today{max-width:820px;margin:6px auto 0;color:var(--sub);font-size:13px}
  main{max-width:820px;margin:0 auto;padding:16px 16px 50px}
  .grid{display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-left:5px solid var(--muted)}
  .chead{display:flex;align-items:center;gap:9px}
  .cname{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .csub{color:var(--sub);font-size:13px;margin:0 0 10px}
  .badge{font-size:11px;border-radius:10px;padding:1px 9px;border:1px solid var(--line);background:#f1f5f9;color:var(--sub);white-space:nowrap}
  .badge.live{background:var(--okbg);border-color:#bbf7d0;color:var(--ok)}
  .badge.local{background:var(--warnbg);border-color:#fcd34d;color:var(--warn)}
  .headline{font-size:14.5px;margin:0 0 2px}
  .subline{color:var(--sub);font-size:13px;margin:0 0 8px}
  .items{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:0 0 10px}
  .it{white-space:nowrap}
  .it.ready{color:var(--ok)}
  .it.none{color:var(--muted)}
  .it.stale{color:var(--warn);font-weight:600}
  .bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin:6px 0 4px}
  .bar>i{display:block;height:100%}
  .prow{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:8px;gap:10px}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .links a{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:7px 15px;font-size:13px;text-decoration:none;color:var(--ink);background:#fff}
  .links a.primary{color:#fff;border-color:transparent}
  .links a:active{transform:scale(.98)}
  .foot{color:var(--sub);font-size:12px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .note{color:var(--sub);font-size:12.5px;margin:6px 0 0}
  .planned{margin-top:26px}
  .planned h2{font-size:13px;color:var(--sub);font-weight:600;margin:0 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:12.5px;border:1px dashed var(--line);border-radius:9px;padding:5px 12px;color:var(--sub);background:#fff}
  .chip b{font-weight:600;color:#4b5563}
  .modeline{margin-top:26px;color:var(--muted);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1 id="ttl">学習ポータル</h1><span id="date"></span></div>
  <div class="today" id="todayline">読み込み中…</div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="planned" id="plannedbox" style="display:none">
    <h2>準備中</h2>
    <div class="chips" id="chips"></div>
  </div>
  <div class="modeline" id="modeline"></div>
</main>

<script>
/* ============================================================
   データ受け口
   portals.js（定義）と 各ポータルの status.js から呼ばれます。
   status.js は「あってもなくてもよい」ものとして扱います。
   ============================================================ */
window.__CFG = null;
window.__STATUS = {};
window.__setPortals = function (c) { window.__CFG = c; };
window.__portalStatus = function (s) { if (s && s.id) window.__STATUS[s.id] = s; };

var IS_LOCAL = (location.protocol === 'file:');

/* file:// では fetch() が CORS で失敗するため、classic script で読み込みます。
   失敗しても握りつぶし、その分は「状態不明」として描きます。 */
function loadScript(src) {
  return new Promise(function (res) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { res(true); };
    s.onerror = function () { res(false); };
    document.head.appendChild(s);
  });
}

function esc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function two(n) { return ('0' + n).slice(-2); }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
function dateLabel() {
  var d = new Date(), w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
  return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + w + ')';
}

/** そのポータルのファイルを指す基準パス。ローカルと公開で切り替えます。 */
function baseOf(p) { return (IS_LOCAL ? p.localBase : p.webBase) || ''; }

/** ローカルで開いていて localBase が無い等、リンクを出せない場合は null。 */
function linkable(p) {
  if (p.state === 'planned') return false;
  if (p.state === 'local') return IS_LOCAL && !!p.localBase;
  return !!baseOf(p);
}

function stateBadge(p) {
  if (p.state === 'live') return '<span class="badge live">稼働中</span>';
  if (p.state === 'local') return '<span class="badge local">ローカル専用</span>';
  return '<span class="badge">準備中</span>';
}

/** status.date が今日なら「今日:」、そうでなければ「直近(日付):」を前置します。
    ポータル固有の解釈はせず、日付文字列の一致だけで判定します。 */
function headlineOf(st) {
  if (!st || !st.headline) return '';
  if (!st.date) return st.headline;
  var t = todayStr();
  var pre = st.date === t ? '今日: ' : (st.date < t ? '直近(' + st.date + '): ' : '次回(' + st.date + '): ');
  return pre + st.headline;
}

function itemChips(st) {
  if (!st || !st.items || !st.items.length) return '';
  var h = '<div class="items">';
  st.items.forEach(function (it) {
    var k = (it.state === 'ready' || it.state === 'none' || it.state === 'stale') ? it.state : 'none';
    var mark = k === 'ready' ? '●' : (k === 'stale' ? '▲' : '○');
    h += '<span class="it ' + k + '">' + mark + ' ' + esc(it.label)
      + (it.detail ? ' <span style="color:var(--sub)">' + esc(it.detail) + '</span>' : '') + '</span>';
  });
  return h + '</div>';
}

function progressBar(st, accent) {
  if (!st || !st.progress || !st.progress.total) return '';
  var d = st.progress.done || 0, t = st.progress.total;
  var pct = Math.max(0, Math.min(100, Math.round(d / t * 100)));
  var h = '<div class="bar"><i style="width:' + pct + '%;background:' + esc(accent) + '"></i></div>';
  h += '<div class="prow"><span>' + d + ' / ' + t + '</span>'
    + (st.next ? '<span>次: ' + esc(st.next) + '</span>' : '') + '</div>';
  return h;
}

function cardHtml(p) {
  var st = window.__STATUS[p.id];
  var accent = p.accent || '#6b7280';
  var h = '<div class="card" style="border-left-color:' + esc(accent) + '">';
  h += '<div class="chead"><span class="cname">' + esc(p.name) + '</span>' + stateBadge(p) + '</div>';
  if (p.subtitle) h += '<p class="csub">' + esc(p.subtitle) + '</p>';

  if (p.state === 'live') {
    if (st) {
      if (st.headline) h += '<p class="headline">' + esc(headlineOf(st)) + '</p>';
      if (st.sub) h += '<p class="subline">' + esc(st.sub) + '</p>';
      h += itemChips(st);
      h += progressBar(st, accent);
    } else {
      h += '<p class="subline">状態を読み込めませんでした（リンクは使えます）</p>';
    }
  }
  if (p.note) h += '<p class="note">' + esc(p.note) + '</p>';
  if (p.state === 'local' && !IS_LOCAL) {
    h += '<p class="note">このポータルは公開していません。PCでハブをローカルに開いたときだけリンクが有効になります。</p>';
  }

  if (linkable(p) && p.links && p.links.length) {
    var b = baseOf(p);
    h += '<div class="links">';
    p.links.forEach(function (ln) {
      var style = ln.primary ? ' class="primary" style="background:' + esc(accent) + '"' : '';
      h += '<a href="' + esc(b + ln.path) + '"' + style + '>' + esc(ln.label) + '</a>';
    });
    h += '</div>';
  }

  var left = p.schedule ? '生成: ' + esc(p.schedule) : '';
  var right = (st && st.updated) ? '更新 ' + esc(st.updated) : '';
  if (left || right) h += '<div class="foot"><span>' + left + '</span><span>' + right + '</span></div>';
  return h + '</div>';
}

/** ヘッダーの一行サマリ。各ポータルの headline を並べるだけで、集計はしません。 */
function todayLine(actives) {
  var t = todayStr(), parts = [];
  actives.forEach(function (p) {
    var st = window.__STATUS[p.id];
    if (st && st.headline && st.date === t) parts.push(p.name + ' ' + st.headline);
  });
  if (!parts.length) return IS_LOCAL
    ? 'ローカル表示です。各ポータルの状態はリンク先で確認してください。'
    : '今日の生成分はまだありません。各カードで直近の回を確認できます。';
  return '今日: ' + parts.join(' ／ ');
}

function render() {
  var cfg = window.__CFG;
  if (!cfg) {
    document.getElementById('todayline').textContent = '設定(portals.js)を読み込めませんでした。';
    return;
  }
  if (cfg.title) { document.title = cfg.title; document.getElementById('ttl').textContent = cfg.title; }
  document.getElementById('date').textContent = dateLabel();

  var actives = cfg.portals.filter(function (p) { return p.state !== 'planned'; });
  var planned = cfg.portals.filter(function (p) { return p.state === 'planned'; });

  document.getElementById('todayline').textContent = todayLine(actives);
  document.getElementById('grid').innerHTML = actives.map(cardHtml).join('');

  if (planned.length) {
    document.getElementById('plannedbox').style.display = '';
    document.getElementById('chips').innerHTML = planned.map(function (p) {
      return '<span class="chip"><b>' + esc(p.name) + '</b>'
        + (p.subtitle ? ' — ' + esc(p.subtitle) : '') + '</span>';
    }).join('');
  }

  document.getElementById('modeline').textContent =
    (IS_LOCAL ? 'ローカル表示' : '公開版') + ' ／ ' + todayStr() + ' 時点';
}

/* ============================================================
   起動: 定義 → 各ポータルの状態 の順に読み、最後に一度だけ描画します。
   ============================================================ */
loadScript('portals.js').then(function () {
  var cfg = window.__CFG;
  if (!cfg) { render(); return; }
  // キャッシュに古い状態が残らないよう日付でクエリを変えます
  var v = todayStr().replace(/-/g, '') + '-' + new Date().getHours();
  var jobs = cfg.portals.filter(function (p) {
    return p.state === 'live' || (p.state === 'local' && IS_LOCAL);
  }).map(function (p) {
    return loadScript(baseOf(p) + (p.statusFile || 'status.js') + '?v=' + v);
  });
  return Promise.all(jobs);
}).then(render, render);
</script>
</body>
</html>
